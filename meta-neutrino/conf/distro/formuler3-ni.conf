require conf/distro/include/neutrino-common.inc
VIRTUAL-RUNTIME_dev_manager = "eudev"
VIRTUAL-RUNTIME_login_manager = "busybox"
VIRTUAL-RUNTIME_init_manager = "sysvinit"
VIRTUAL-RUNTIME_initscripts = "initscripts"

DISTRO_NAME = "Neutrino"
DISTRO_VERSION = "0.1"
# Keep resolved AUTOREV heads between local rebuilds. Our GUI/HAL and base
# checkouts remain explicitly pinned; refreshing other heads is deliberate.
BB_SRCREV_POLICY = "cache"
DISTRO_FEATURES = "alsa ext2 largefile wifi nfs pam ipv4 ipv6"
INIT_MANAGER = "sysvinit"
# Preserve OpenPLi's compatibility policy and glibc bbappend for old STB kernels.
OLDEST_KERNEL = "3.2"
PREFERRED_PROVIDER_virtual/kernel = "linux-formuler"
PREFERRED_VERSION_linux-formuler = "4.10.6"
PREFERRED_VERSION_libmicrohttpd = "1.0.10"
PREFERRED_PROVIDER_openthreads = "ni-openthreads"
PREFERRED_VERSION_ffmpeg = "6.1.4"
SRCREV:pn-libdvbsi++ = "f3c40ea6daa94a3bfeeee1ef9381c68629a68b81"
MACHINE_EXTRA_RRECOMMENDS:remove = "gst-plugin-dvbmediasink ntfs-3g"
LICENSE_FLAGS_ACCEPTED:append = " commercial"

PACKAGECONFIG:pn-ffmpeg = "avcodec avformat swresample swscale alsa bzlib zlib openssl libass libfreetype libxml2"
EXTRA_OECONF:append:pn-ffmpeg = " --disable-mips32r2 --disable-mipsdsp --disable-mipsdspr2 --disable-mipsfpu --disable-msa"
