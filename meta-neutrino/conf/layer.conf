BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"
BBFILE_COLLECTIONS += "neutrino"
BBFILE_PATTERN_neutrino = "^${LAYERDIR}/"
BBFILE_PRIORITY_neutrino = "9"
LAYERSERIES_COMPAT_neutrino = "scarthgap"
LAYERDEPENDS_neutrino = "core openembedded-layer networking-layer multimedia-layer meta-python"
NEUTRINO_BASE := "${@os.path.normpath('${LAYERDIR}/../')}"
NEUTRINO_BASE[vardepvalue] = "neutrino-oe-core"
LICENSE_PATH += "${LAYERDIR}/licenses"
