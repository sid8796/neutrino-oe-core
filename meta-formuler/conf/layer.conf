# We have a conf and classes directory, append to BBPATH
BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*.bb ${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*.bbappend ${LAYERDIR}/recipes-*/*/*.bbappend"

BSP-BASE-FORMULER := '${@os.path.normpath("${LAYERDIR}/")}'

BBFILE_COLLECTIONS += "formuler"
BBFILE_PATTERN_formuler = "^${LAYERDIR}/"
BBFILE_PRIORITY_formuler = "6"
LAYERSERIES_COMPAT_formuler = "scarthgap"
LAYERDEPENDS_formuler = "core neutrino"
